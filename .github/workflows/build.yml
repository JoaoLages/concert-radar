name: Build concerts page

on:
  schedule:
    - cron: "17 6 * * *" # daily; an odd minute avoids the top-of-hour queue
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a normal run takes about 5; fail instead of hanging on a stuck site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - id: pages
        uses: actions/configure-pages@v6
      # The live page's state.json remembers when each show first appeared and when each site last worked.
      - name: Fetch previous state
        run: |
          mkdir -p site
          curl -fsSL "${{ steps.pages.outputs.base_url }}/state.json" -o site/state.json || rm -f site/state.json
      # One-off: seed the artist list so this run can deploy while Spotify rate-limits the app. Remove after.
      - name: Seed artists
        run: cp seed-state.json site/state.json
      - name: Build
        run: uv run concert-radar build --out site --page-url "${{ steps.pages.outputs.base_url }}/"
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
